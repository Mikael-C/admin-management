services:
  # ─── Express.js Backend ───────────────────────────
  - type: web
    name: estatepro-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estatepro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app  # Update this after deploying frontend
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@estatepro.com
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@2024
      - key: SUPER_ADMIN_NAME
        value: Super Administrator

  # ─── PostgreSQL Database ──────────────────────────
databases:
  - name: estatepro-db
    region: oregon
    plan: free
    databaseName: estatepro
    user: estatepro_user
